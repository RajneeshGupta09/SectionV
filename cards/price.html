<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Table</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }

    .pricing-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 40px;
      flex-wrap: wrap;
    }

    .pricing-card {
      flex: 1;
      max-width: 300px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }

    .pricing-card h2 {
      margin-bottom: 10px;
      font-size: 1.5rem;
    }

    .pricing-card .price {
      font-size: 1.8rem;
      font-weight: bold;
      margin: 15px 0;
      color: #333;
    }

    .pricing-card ul {
      list-style: none;
      padding: 0;
      margin: 20px 0;
      text-align: left;
    }

    .pricing-card ul li {
      margin: 10px 0;
      padding-left: 20px;
      position: relative;
    }

    .pricing-card ul li::before {
      content: "✔";
      position: absolute;
      left: 0;
      color: green;
    }

    .pricing-card button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s ease;
    }

    .pricing-card button:hover {
      background: #0056b3;
    }

    .pricing-card.standard {
      background: #e6f3ff;
      transform: scale(1);
    }

    .pricing-card.standard:hover {
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .pricing-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="pricing-container">
    <!-- Basic Plan -->
    <div class="pricing-card">
      <h2>Basic</h2>
      <p class="price">$9/month</p>
      <ul>
        <li>1 GB Storage</li>
        <li>Basic Support</li>
        <li>Access to Community</li>
      </ul>
      <button>Sign Up</button>
    </div>

    <!-- Standard Plan -->
    <div class="pricing-card standard">
      <h2>Standard</h2>
      <p class="price">$19/month</p>
      <ul>
        <li>10 GB Storage</li>
        <li>Priority Support</li>
        <li>Access to All Features</li>
      </ul>
      <button>Sign Up</button>
    </div>

    <!-- Premium Plan -->
    <div class="pricing-card">
      <h2>Premium</h2>
      <p class="price">$29/month</p>
      <ul>
        <li>Unlimited Storage</li>
        <li>24/7 Support</li>
        <li>Advanced Features</li>
      </ul>
      <button>Sign Up</button>
    </div>
  </div>
</body>
</html>
