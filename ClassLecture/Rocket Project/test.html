<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab dated 9/9/25</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500vw;
            height: 97vh;
            background-image: url(./Space.png);
            border: 2px solid black;
            display: flex;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            animation: moveRightJiggle 4s ease-in-out forwards,
        }

        .rocket {
            height: 400px;
            width: 400px;
            position: absolute;

        }

        .cody {
            height: 120px;
            width: 100px;
            transform: rotate(337deg);
            margin-left: 85%;
            position: absolute;
            animation: flyUp 4s forwards 5s;
        }

        @keyframes moveRightJiggle {
            0% {
                left: 0;
            }

            20% {
                left: 20%;
            }

            40% {
                left: 40%;

            }

            60% {
                left: 60%;
            }

            80% {
                left: 75%;
            }

            100% {
                left: 83%;

            }
        }

        @keyframes turnUp {
            from {
                transform: rotate(48deg);
            }

            to {
                transform: rotate(-39deg);
            }
        }

        @keyframes flyUp {
            from {
                top: 0;
            }

            to {
                top: -100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="./rocket.png" alt="" class="rocket">
        <img src="./Cody.png" alt="" class="cody">
    </div>
</body>

</html>
