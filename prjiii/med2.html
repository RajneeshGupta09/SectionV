<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <div class="logo">Medium</div>
            <ul class="nav-links">
                <li><a href="#">Our story</a></li>
                <li><a href="#">Membership</a></li>
                <li><a href="#">Write</a></li>
                <li><a href="#">Sign in</a></li>
            </ul>
            <button class="cta-button">Get started</button>
        </nav>
    </header>

    <main class="hero-section">
        <div class="hero-content">
            <h1 class="main-heading">Human stories & ideas</h1>
            <p class="sub-heading">A place to read, write, and deepen your understanding</p>
            <button class="start-reading-button">Start reading</button>
        </div>
    </main>

    <footer class="footer">
        <ul class="footer-links">
            <li><a href="#">About</a></li>
            <li><a href="#">Help</a></li>
            <li><a href="#">Terms</a></li>
            <li><a href="#">Privacy</a></li>
        </ul>
    </footer>

</body>
</html>
