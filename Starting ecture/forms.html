    <h2>Complex Form</h2>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name</label>
            <input type="text" name="name" id="name">
            <br><br>
            <label for="Email">Email</label>
            <input type="email" name="Email" id="Email">
            <br><br>
            <label for="tel">Telephone</label>
            <input type="tel" name="tel" id="tel">
            <br><br>

            <label for="Dob">Date of Birth</label>
            <input type="date" name="Dob" id="Dob">
            <br><br>

            <label>Gender:</label>
            <br><br>
            <label for="radio">Male</label>
            <input type="radio" name="radio" id="radio2">
            <br><br>
            <label for="radio2">Female</label>
            <input type="radio" name="radio" id="radio2">
            <br><br>
            <label for="con">Country</label>
            <select name="con" id="con">
                <option value="in">India</option>
                <option value="bh">Bharat</option>
            </select>

        </fieldset>
        <br><br>

        <fieldset>
            <legend>Address Street</legend>
            <label for="st">Street</label>
            <input type="text" id="st">
            <br><br>
            <label for="ct">City</label>
            <input type="text" name="ct" id="ct">
            <br><br>
            <label for="st">State</label>
            <input type="text" name="st" id="st">
            <br><br>
            <label for="zip">Zipcode</label>
            <input type="text" name="zip" id="zip">
        </fieldset>
        <br><br>

        <fieldset>
            <legend>Other Information </legend>
            <label for="cmt">Comments</label>
            <textarea name="cmt" id="cmt"></textarea>
            <br><br>
            <label for="but">I agree to the term of service</label>
            <input type="checkbox" name="but" id="but">
        </fieldset>
        <br><br>
        <button>Submit</button>

    </form>

</body>
