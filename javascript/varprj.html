<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Quantity</title>
</head>
<body>

    <p>Card Quantity</p>
    <button onclick="console.log(`Cart Quantity: ${show_Quantity}`);">Show Quantity</button>
    <button onclick="show_Quantity = show_Quantity + 1;
      console.log(`Cart Quantity: ${show_Quantity}`)">Add to Cart</button>

    <button onclick="show_Quantity = show_Quantity + 2;
    console.log(`Cart Quantity: ${show_Quantity}`)">+2</button>

    <button onclick="show_Quantity = show_Quantity + 3;
    console.log(`Cart Quantity: ${show_Quantity}`)">+3</button>

    
    <button onclick="show_Quantity += 4;
    console.log(`Cart Quantity: ${show_Quantity}`)">+4</button>

    
    <button onclick="show_Quantity += 5;
    console.log(`Cart Quantity: ${show_Quantity}`)">+5</button>

    
    <button onclick="show_Quantity--;
    console.log(`Cart Quantity: ${show_Quantity}`)">Remove from cart</button>

    
    <button onclick="show_Quantity -= 2;
    console.log(`Cart Quantity: ${show_Quantity}`)">-2</button>

    
    <button onclick="show_Quantity -=3;
    console.log(`Cart Quantity: ${show_Quantity}`)">-3</button>

    <button onclick="show_Quantity = 0;
    console.log('Cart was reset.');
    console.log(`Cart Quantity: ${show_Quantity}`);">Reset Cart</button>
    
    <script>
        let show_Quantity = 0;
    </script>


    <script>
        let name = 'Rajneesh';
        console.log(`My name is: ${name}`);

        let cost = 5 + (2*3) + 9;
        console.log(`Cost of food: ${cost}`);

        let result = cost * 0.1;
        console.log(`Tax(10%): ${result}`);



    </script>
</body>
</html>
