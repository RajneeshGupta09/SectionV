<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function 2</title>
</head>
<body>
    <script>
        function greet(name){

            if(name){
                console.log(`Hello! ${name}`);
            } else if(name === undefined){
                console.log('Hi there!');
            }
            else if(name=='Rajneesh'){
                console.log(`Hello! ${name}`);
            }

        }


        function convertLength(length, from, to){

            if(from=='miles'){
                console.log(`km - ${length*1.6}`);
                console.log(`ft - ${length*5280}`);
            } else if(from=='km'){
                console.log(`miles - ${length/1.6}`);
                console.log(`ft - ${length*3281}`);
            } else if(to=='ft'){
                console.log(`km - ${length/3281}`);
                console.log(`miles - ${length/5280}`);
            } else if(from != 'miles' || from != 'miles' || to != 'miles'|| to != 'miles'){
                console.log(`Invalid unit: ${from}`);
            }

        }

        convertLength(50, 'km', 'lbs');
        greet();


    </script>
</body>
</html>
